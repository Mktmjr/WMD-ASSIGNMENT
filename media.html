<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JCI Media Gallery</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navbar (Consistent with Homepage) -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="jci-gaborone-logo.png" alt="JCI Gaborone Logo" class="d-inline-block align-top logo-img">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="media.html">Media</a></li>
          <li class="nav-item"><a class="nav-link" href="elections.html">Elections</a></li>
          <li class="nav-item"><a class="nav-link" href="forum.html">Mentorship</a></li>
        </ul>
        <button id="darkModeToggle" class="btn ms-3">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Media Gallery Section -->
  <section class="media-gallery py-5">
    <div class="container">
      <h1 class="text-center mb-4">JCI Media Gallery</h1>
      
      <!-- Filter Tabs -->
      <ul class="nav nav-pills justify-content-center mb-4" id="mediaTabs">
        <li class="nav-item">
          <a class="nav-link active" data-bs-toggle="pill" href="#all">All</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="pill" href="#events">Events</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="pill" href="#projects">Projects</a>
        </li>
      </ul>

      <!-- Gallery Grid -->
      <div class="tab-content">
        <div class="tab-pane fade show active" id="all">
          <div class="row g-4" id="media-grid-all">
            <!-- Populated by JavaScript -->
          </div>
        </div>
        <div class="tab-pane fade" id="events">
          <div class="row g-4" id="media-grid-events">
            <!-- Populated by JavaScript -->
          </div>
        </div>
        <div class="tab-pane fade" id="projects">
          <div class="row g-4" id="media-grid-projects">
            <!-- Populated by JavaScript -->
          </div>
        </div>
      </div>

      <!-- Upload Button (Placeholder for Future Backend) -->
      <div class="text-center mt-5">
        <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#uploadModal">
          <i class="fas fa-upload me-2"></i>Upload Media
        </button>
      </div>
    </div>
  </section>

  <!-- Upload Modal (Hidden Until Backend Added) -->
  <div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Upload Media</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="uploadForm">
            <div class="mb-3">
              <label class="form-label">Select Files</label>
              <input type="file" class="form-control" multiple>
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select class="form-select">
                <option>Event</option>
                <option>Project</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Upload</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4">
    <div class="container text-center">
      <p>&copy; 2025 JCI Gaborone. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="media.js"></script>
</body>
</html>
